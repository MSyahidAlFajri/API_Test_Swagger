        - customer_id
    CustomerDataHitResponse:  
      type: object  
      properties:  
        status:  
          type: string  
          example: "success"  
        message:  
          type: string  
          example: "Data berhasil disimpan."  
        data:  
          type: object  
          properties:  
            customer_id:  
              type: integer  
              example: 802  
            rmib_1_id:  
              type: integer  
              nullable: true  
              example: null  
            rmib_2_id:  
              type: integer  
              nullable: true  
              example: null  
            rmib_3_id:  
              type: integer  
              nullable: true  
              example: null  
            answers:  
              type: string  
              nullable: true  
              example: null  
            essay_answers:  
