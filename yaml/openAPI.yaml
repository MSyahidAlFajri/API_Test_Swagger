                            id:  
                              type: integer  
                              example: 32  
                            name:  
                              type: string  
                              example: JAWA BARAT  
            address:  
              type: string  
              example: bandung  
            number:  
              type: string  
              example: 08317438123123  
            blood_group:  
              type: string  
              example: O  
            religion:  
              type: string  
              example: "1"  
            status:  
              type: string  
              example: Belum Kawin  
            ethnic:  
              type: string  
              example: Sunda  
            nationality:  
              type: string  
              example: Indonesia  
            child_number:  
              type: integer  
              example: 2  
            from_child_number:  
              type: integer  
              example: 3  
            grade:  
              type: string  
              example: "12"  
            majoring:  
              type: string  
              example: IPA  
            institutions:  
              type: object  
              properties:  
                id:  
                  type: integer  
                  example: 18  
                name:  
                  type: string  
