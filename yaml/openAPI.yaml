openapi: 3.0.3
info:
  title: Dokumen API untuk Fitur Tes RMIB - OpenAPI 3.0
  description: >-
    Dokumentasi API untuk Fitur Tes RMIB
  termsOfService: https://github.com/MSyahidAlFajri/API_Test_Swagger
  contact:
    email: masyahida4@gmail.com
  license:
    name: Backend Package
    url: https://pkg.go.dev/github.com/Rumahkopi/rkbackend
  version: 1.0.11
externalDocs:
  description: Website
  url: http://localhost:5173/login
servers:
  - url: http://127.0.0.1:8000/api/
tags:
  - name: Auth
    description: Authentikasi
    externalDocs:
      description: Deskripsi dan Kode Program
      url: https://github.com/Rumahkopi/rkbackend
  - name: Registeration
    description: Registeration User
    externalDocs:
      description: Deskripsi dan Kode Program
      url: https://github.com/Rumahkopi/rkbackend
  - name: Fitur Tes RMIB
    description: Pengelolaan Tes RMIB
    externalDocs:
      description: Deskripsi dan Kode Program
      url: https://github.com/Rumahkopi/rkbackend
paths:
  /login:
    post:
      tags:
        - Auth
      summary: Login get Token
      description: Login and Get Admin Token
      operationId: authService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '405':
          description: Invalid input
  /register:
    post:
      tags:
        - Registeration
      summary: Register User
      description: Register User 
      operationId: authService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '405':
          description: Invalid input
  /hit:
    post:
      tags:
        - Fitur Tes RMIB
      summary: API hit
      description: API hit ini berfungsi mendapatkan customer_rmib_id untuk proses test RMIB dan akan di gunakan untuk bagian mengirimkan jawaban, jika tidak di lakukan makan akan menghambat proses tahapan tes RMIB 
      operationId: hitCustomerRmibId 
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDataHit'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDataHitResponse'
        '405':
          description: Invalid input          
      security:  
        - BearerAuth: []        
  /rmib/questions:  
    get:  
      tags:  
        - Fitur Tes RMIB  
      summary: Get Soal RMIB Berdasarkan Gender   
      description: Get soal RMIB berdasarkan gender, jadi pengimplementasian API nya menggunakan Params jadi di tambahkan ?gender= sesuai dengan gandernya ,jika laki - laki itu di tandai dengan 1 dan jika perempuan di tandai dengan 2  
      operationId: GetsoalRMIB  
      parameters:  
        - name: gender  
          in: query  
          required: true  
          description: Gender (1 untuk laki-laki, 2 untuk perempuan)  
          schema:  
            type: integer  
            enum: [1, 2]  
      responses:  
        '200':  
          description: successful operation  
          content:  
            application/json:  
              schema:  
                type: array  
                items:  
                  $ref: '#/components/schemas/GetQustionRMIBResponse'  
        '400':  
          description: Invalid status value  
      security:  
        - BearerAuth: [] 
  /answer:
    post:
      tags:
        - Fitur Tes RMIB
      summary: Post Jawaban
      description: API ini berfungsi untuk mengirimkan hasil jawaban yang sudah di isi oleh customer 
      operationId: PostJawaban
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produk'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '405':
          description: Invalid input          
      security:  
        - BearerAuth: []
  
components:
  schemas:
    Login:
      type: object
      properties:
        email:
          type: string
          example: syahid25@gmail.com
        password:
          type: string
          example: password
    LoginResponse:  
      type: object  
      properties:  
        success:  
          type: boolean  
          example: true  
        user:  
          type: object  
          properties:  
            id:  
              type: integer  
              example: 792  
            email:  
              type: string  
              format: email  
              example: syahid@gmail.com  
            role:  
              type: string  
              example: customer  
        customer:  
          type: object  
          properties:  
            id:  
              type: integer  
              example: 800  
            user:  
              type: object  
              properties:  
                id:  
                  type: integer  
                  example: 792  
                email:  
                  type: string  
                  format: email  
                  example: syahid@gmail.com  
                role:  
                  type: string  
                  example: customer  
                created_at:  
                  type: string  
                  format: date-time  
                  example: 2025-01-01T12:10:46.000000Z  
