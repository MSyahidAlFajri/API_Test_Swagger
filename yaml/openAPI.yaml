              type: string  
              format: date-time  
              nullable: true  
              example: null  
            age:  
              type: integer  
              nullable: true  
              example: null  
            updated_at:  
              type: string  
              format: date-time  
              example: "2025-01-13T14:27:15.000000Z"  
            created_at:  
              type: string  
              format: date-time  
              example: "2025-01-13T14:27:15.000000Z"  
            id:  
              type: integer  
              example: 3  
      required:  
        - status  
        - message  
        - data  
    GetQustionRMIBResponse:  
      type: object  
      properties:  
        data:  
          type: array  
          items:  
            type: object  
            properties:  
              type:  
                type: string  
                example: "A"  
              job:  
                type: array  
                items:  
                  type: object  
                  properties:  
                    name:  
                      type: string  
                      example: "Pekerjaan Pertanian"  
      required:  
        - data  

  securitySchemes:  
    BearerAuth:  
      type: http  
      scheme: bearer  
      bearerFormat: JWT  
security:  
  - BearerAuth: []

      