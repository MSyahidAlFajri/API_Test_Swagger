          example: true  
        is_free:  
          type: boolean  
          example: true  
        message:  
          type: string  
          example: "Registrasi berhasil. Silahkan lanjutkan dengan Log In"
    CustomerDataHit:  
      type: object  
      properties:  
        customer_id:  
          type: integer  
          example: data beruba integer id ini di ambil dari customer_id   
        rmib_1_id:  
          type: integer  
          nullable: true  
          example: null  
        rmib_2_id:  
          type: integer  
          nullable: true  
          example: null  
        rmib_3_id:  
          type: integer  
          nullable: true  
          example: null  
        answers:  
          type: string  
          nullable: true  
          example: null  
        essay_answers:  
          type: string  
          nullable: true  
          example: null  
        time:  
          type: string  
          format: date-time  
          nullable: true  
          example: null  
        age:  
          type: integer  
          nullable: true  
          example: null  
